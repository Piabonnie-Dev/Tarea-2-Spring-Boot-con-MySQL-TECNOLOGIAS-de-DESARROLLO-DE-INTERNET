<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Financiera</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <div class ="contenedor">
        
    <h1>Financiera</h1>

    <form th:action="@{/guardar}" th:object="${credito}" method="post">

        <label>Fecha:</label>
        <input type="date" th:field="*{fecha}" required>
        <br><br>

        <label>Moneda:</label>
        <select th:field="*{moneda}" required>
            <option value="">Seleccione</option>
            <option value="Pesos">Pesos</option>
            <option value="Dólares">Dólares</option>
        </select>
        <br><br>

        <label>Monto:</label>
        <input type="number" step="0.01" th:field="*{monto}" required>
        <br><br>

        <label>Periodo (meses):</label>
        <input type="number" th:field="*{periodo}" required>
        <br><br>

        <label>Cuota:</label>
        <input type="number" step="0.01" th:field="*{cuota}" required>
        <br><br>

        <label>TEA (%):</label>
        <input type="number" step="0.01" th:field="*{tea}" required>
        <br><br>

        <label>Fecha de vencimiento:</label>
        <input type="date" th:field="*{fechaVencimiento}" required>
        <br><br>

        <button type="submit">Guardar</button>

    </form>
    </div>
</body>
</html>
